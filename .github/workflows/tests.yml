name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -e ".[dev]"
      
      - name: Run backend tests
        run: |
          source venv/bin/activate
          pytest

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: changeset_editor/frontend
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: changeset_editor/frontend/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run frontend tests
        run: npm run test:ci
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        if: always()
        with:
          file: ./changeset_editor/frontend/coverage/coverage-final.json
          flags: frontend
          name: frontend-coverage

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -e ".[dev]"
      
      - name: Run linter
        run: |
          source venv/bin/activate
          make lint
