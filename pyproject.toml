[project]
name = "stiflyt"
version = "0.1.0"
description = "Backend system for processing routes from turrutebasen and mapping matrikkelenhet"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "psycopg[binary]>=3.1.0",
    "utm>=0.7.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "openpyxl>=3.1.0",
    "zeep>=4.2.0",
    "pyyaml>=6.0.0",
    "pytest>=7.0.0",
    "mcp>=1.0.0",
    "Pillow>=10.0.0",
    "pillow-heif>=0.16.0",
    "python-multipart>=0.0.6",
]
[project.scripts]
matrikkel-cli = "matrikkel.cli:main"
query-routes = "cli.query_routes:main"
stiflyt-mcp = "stiflyt_mcp.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cli", "api", "services", "matrikkel", "stiflyt_mcp"]

[tool.setuptools.package-data]
"*" = ["*.txt", "*.md"]

[tool.black]
line-length = 100
target-version = ['py39']

[tool.flake8]
max-line-length = 100
exclude = [".git", "__pycache__", "venv", ".venv"]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests that require a live database",
]
addopts = [
    "--ignore=scripts/test_matrikkel_integration.py",
]