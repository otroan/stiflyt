# Local errata for Kartverket turrutebasen data.
#
# Covers ops.rutenummer_remap, ops.unmarked_segment, ops.route_link_exclusion,
# ops.route_link_bridge, and ops.route_metadata_override. The signs_app UI
# writes link exclusions, bridges, and metadata overrides directly to the
# database, so the DB is the runtime source of truth; this file is the
# version-controlled snapshot. Regular workflow:
#
#     make dump-route-errata     # DB  -> this file (commit the result)
#     make sync-route-errata     # this file -> DB  (bootstrap/restore; OVERWRITES)
#
# Five sections:
#
#   rutenummer_remaps:    rename/hide a Kartverket rutenummer (string-keyed)
#   unmarked_segments:    flag a fotrute_fk as boat / glacier / other unmarked
#                          crossing (integer-keyed)
#   link_exclusions:      drop link(s) from one route's corrected graph, keyed
#                          by rutenummer with a list of { link_id, reason,
#                          comment, reported_at } — used to resolve loop/variant
#                          routes (e.g. fem30) flagged by the loop validator.
#   bridges:              connect parts of a disconnected route, keyed by
#                          rutenummer with a list of { a_node, b_node, reason,
#                          comment, reported_at } — used to repair routes (e.g.
#                          fem22) flagged by the disconnected validator.
#   metadata_overrides:   canonical rutenavn / vedlikeholdsansvarlig / rutetype /
#                          gradering for a route, keyed by rutenummer — used to
#                          fix INCONSISTENT_* / MISSING_* / RUTENAVN_UKJENT.
#
# For rutenummer_remaps each entry takes one of:
#
#   to: <other_rutenummer>   — retag every segment from the key to this rutenummer
#   delete: true             — hide every segment with this rutenummer from the signs_app
#
# Exactly one of {to, delete} must be set. Removing an entry and re-syncing
# restores the original tag / segment.
#
# For unmarked_segments the segment stays in the graph (topology + routeplanner
# need it) but signs_app suffixes sign panels traversing it with the kind/label
# ("via bre", "via båt", …) and length stats can subtract it.
#
# Each entry should link to the Kartverket ticket / DNT contact so the patch
# can be cleaned up when the source data is fixed.

rutenummer_remaps:

  # Segments labelled by Kartverket with the date-style id "20160407" should
  # actually be part of bre26 (Sunndalen → Sunndalssætra) per DNT.
  "20160407":
    to: bre26
    comment: "Should be bre26 (Sunndalen → Sunndalssætra)"
    reported_at: 2026-05-25

  # bre7 was removed by DNT — Kartverket still has the stub geometry tagged.
  # Hide every bre7 segment so it stops contributing endpoints, panels,
  # and lines to the signs_app.
  "bre7":
    delete: true
    comment: "bre7 deleted by DNT; spur at node 108545. Reported to Kartverket."
    reported_at: 2026-05-25


unmarked_segments:

  # Femundsmarka — boat crossings over Lake Femunden (M/S Fæmund). Kartverket
  # has drawn these as ordinary fotruter with vertices hundreds of metres apart,
  # which is geometrically impossible for a footpath. Confirmed via
  # scripts/detect_boat_segments.py: 200–650 m per vertex on a real trail
  # samples every ≤30 m. lokalid is the Kartverket-stable UUID for the ticket.
  86032: { kind: boat, lokalid: "17510e10-f6da-496a-8e6a-156773c8bea6", comment: "fem7/59/62/63/64/65/66 ferry across Femunden (3.9 km)", reported_at: 2026-05-25 }
  86033: { kind: boat, lokalid: "bd086b9a-9083-4ce3-8b9c-7ef2ab063a45", comment: "fem60/63/64/65/66 ferry across Femunden (7.8 km)",       reported_at: 2026-05-25 }
  86034: { kind: boat, lokalid: "da253c42-efd0-467f-a413-c989e8261e88", comment: "fem59/61/64/65/66 ferry across Femunden (9.7 km)",       reported_at: 2026-05-25 }
  86226: { kind: boat, lokalid: "88e228e5-7903-4c91-93f1-8910d62dabc5", comment: "fem58/59/61/65/66 ferry across Femunden (2.6 km)",       reported_at: 2026-05-25 }
  86325: { kind: boat, lokalid: "2842814b-33ab-424c-b294-d3e3d14388b0", comment: "fem56/57/58/59/61 ferry across Femunden (8.1 km)",       reported_at: 2026-05-25 }
  86326: { kind: boat, lokalid: "4210352b-0d69-4932-83ff-0d93a72eb8ac", comment: "fem57/58/59/61/66 ferry across Femunden (6.6 km)",       reported_at: 2026-05-25 }
  85936: { kind: boat, lokalid: "f002f51e-46f7-44a2-bf7d-602b132ed101", comment: "fem31/54 ferry across Femunden (2.4 km)",                reported_at: 2026-05-25 }

  # Breheimen — bre8 Sota–Nørdstedalseter crosses Fortundalsbreen. Glacier,
  # not lake — DNT does not mark or maintain the bre traverse.
  99702:
    kind: glacier
    label: Fortundalsbreen
    lokalid: "3d561a4d-0b84-4265-80cf-ef485644ef47"
    comment: "bre8 glacier traverse Sota–Nørdstedalseter over Fortundalsbreen (3.3 km)"
    reported_at: 2026-05-25


# Loop/variant routes resolved by excluding the wrong arm's links. Usually
# authored in the signs_app Validering tab (which writes straight to the DB);
# `make dump-route-errata` materialises them here. Example shape:
#
# link_exclusions:
#   fem30:
#     - { link_id: 266, reason: wrong_arm, comment: "arm via Plåssjøen unmarked", reported_at: 2026-05-27 }
#     - { link_id: 27795, reason: wrong_arm, reported_at: 2026-05-27 }


# Disconnected routes reconnected by bridging two near nodes. Usually authored
# in the signs_app Validering tab ("Koble sammen"); `make dump-route-errata`
# materialises them here. Example shape:
#
# bridges:
#   fem22:
#     - { a_node: 25159, b_node: 93510, reason: digitizing_gap, comment: "10 m gap", reported_at: 2026-05-27 }
#     - { a_node: 95564, b_node: 121951, reason: digitizing_gap, comment: "14 m gap", reported_at: 2026-05-27 }
