# Defaults for the sign manufacturing list (services/sign_excel.py).
#
# Values here are read at process start by services/sign_back_template.py
# and surfaced in the Excel export. Edit and restart the server to apply.

# Text printed on the back of each sign — shown as the "Baksidetekst"
# column in the Excel export and as the default for new sign sites.
#
# Placeholders substituted per site:
#   {name}                — anchor / placename ("" for manual sign sites)
#   {easting} {northing}  — UTM 32V coordinates, rounded to 10 m
#
# Lines whose placeholders all resolve to empty are dropped, so an
# anchor-less manual sign site won't print a blank first line.
baksidetekst: |
  {name}
  UTM 32V {easting} {northing}
  Stier er ryddet og merket av DNT Oslo og Omegn
